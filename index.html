<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown 阅读器</title>
  <meta name="color-scheme" content="light dark">

  <!-- ① dsh 的设计 token：先字体与动效，再调色板，再读 token 的两张表。顺序不能换。 -->
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/design-platform.css">
  <link rel="stylesheet" href="styles/scrollbar.css">
  <link rel="stylesheet" href="styles/gradient-shadow-text.css">
  <link rel="stylesheet" href="styles/shiki.css">

  <!-- ② 从 dsh 的 markdown 渲染搬过来的样式（1:1） -->
  <link rel="stylesheet" href="styles/markdown.css">
  <!-- ③ 把 highlight.js 的类名映射到 dsh 的 --shiki-* 语法色 -->
  <link rel="stylesheet" href="styles/highlight-dsh.css">
  <!-- ④ 公式（KaTeX 自带样式，dsh 用的是同一个库） -->
  <link rel="stylesheet" href="vendor/katex.min.css">

  <!-- ⑤ 阅读器自己的壳与控件 -->
  <link rel="stylesheet" href="styles/reader.css">
  <link rel="stylesheet" href="styles/controls.css">
</head>

<!-- 暗色模式：给 body 加 data-ds-dark-theme 属性即可（dsh 的机制）。
     这两个属性还会被阅读器用来控制侧栏开合与是否正在阅读。 -->
<body data-sidebar="open" data-reading="false" data-bg-mode="preset" data-code-wrap="on">

  <!-- 背景层：图片/渐变 + 模糊，遮罩由 CSS 按主题自动选 -->
  <div class="bg" id="bg" aria-hidden="true"></div>

  <!-- 顶部阅读进度条 -->
  <div class="progress" aria-hidden="true"><i id="progress-bar"></i></div>

  <div class="app">
    <!-- 侧栏：文件列表（服务模式）+ 本页目录 -->
    <aside class="sidebar glass" id="sidebar" aria-label="导航">
      <div class="sidebar-brand">
        <span class="dot" aria-hidden="true"></span>
        <span>Markdown 阅读器</span>
        <span class="root-name" id="root-name"></span>
      </div>

      <div class="sidebar-section files" id="files-section" hidden>
        <div class="section-label">文档</div>
        <div id="file-list"></div>
      </div>

      <div class="sidebar-divider" id="files-divider" hidden></div>

      <div class="sidebar-section toc" id="toc-section">
        <div class="section-label">本页目录</div>
        <div id="toc"></div>
      </div>
    </aside>

    <!-- 主舞台 -->
    <main class="stage" id="stage">
      <header class="topbar glass">
        <button class="icon-btn" id="btn-sidebar" type="button" title="显示/隐藏侧栏（\ 键）" aria-label="显示或隐藏侧栏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/><path d="M12.5 9h5M12.5 13h5"/></svg>
        </button>
        <div class="title-wrap">
          <div class="doc-title" id="doc-title">还没有打开文档</div>
          <div class="doc-meta" id="doc-meta">拖入 .md 文件，或按 ⌘/Ctrl+O 选择</div>
        </div>
        <div class="tools">
          <button class="icon-btn" id="btn-search" type="button" title="文内搜索（/ 或 ⌘/Ctrl+F）" aria-label="文内搜索">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="m20 20-3.6-3.6"/></svg>
          </button>
          <button class="icon-btn" id="btn-open" type="button" title="打开文件（⌘/Ctrl+O）" aria-label="打开文件">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h3.2l1.6 2H18.5A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"/></svg>
          </button>
          <div class="segmented" role="group" aria-label="主题">
            <button type="button" data-theme="system" title="跟随系统" aria-label="跟随系统">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M9 20h6"/></svg>
            </button>
            <button type="button" data-theme="light" title="浅色" aria-label="浅色">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>
            </button>
            <button type="button" data-theme="dark" title="深色" aria-label="深色">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
            </button>
          </div>
          <button class="icon-btn" id="btn-settings" type="button" title="阅读设置" aria-label="阅读设置">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h10M18 17h2"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="16" cy="17" r="2"/></svg>
          </button>
          <button class="icon-btn" id="btn-print" type="button" title="打印 / 导出 PDF（⌘/Ctrl+P）" aria-label="打印">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9V4h10v5"/><rect x="4" y="9" width="16" height="7" rx="2"/><path d="M7 16h10v4H7z"/></svg>
          </button>
        </div>
      </header>

      <!-- 空状态 -->
      <section class="empty glass" id="empty">
        <h1>Markdown 阅读器</h1>
        <p>把 .md 文件拖进窗口，或点下面的按钮。<br>排版与 DeepSeek Harness 的聊天正文一致。</p>
        <div class="actions">
          <button class="btn primary" id="btn-open-2" type="button">打开 .md 文件</button>
          <button class="btn" id="btn-sample" type="button">看一篇示例</button>
        </div>
        <div class="hint">
          <kbd>/</kbd> 搜索 · <kbd>\</kbd> 侧栏 · <kbd>T</kbd> 主题 · <kbd>Esc</kbd> 退出
        </div>
      </section>

      <!-- 正文 -->
      <article class="doc glass" id="doc">
        <div class="markdown" id="content"></div>
      </article>

      <footer class="doc-foot" id="doc-foot">
        <span id="foot-left"></span>
        <span id="foot-right"></span>
      </footer>
    </main>
  </div>

  <!-- 搜索条 -->
  <div class="searchbar glass" id="searchbar" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-3.6-3.6"/></svg>
    <input id="search-input" type="search" placeholder="在文档中搜索…" aria-label="在文档中搜索" autocomplete="off" spellcheck="false">
    <span class="count" id="search-count"></span>
    <button class="icon-btn" id="search-prev" type="button" title="上一处（Shift+Enter）" aria-label="上一处">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>
    </button>
    <button class="icon-btn" id="search-next" type="button" title="下一处（Enter）" aria-label="下一处">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <button class="icon-btn" id="search-close" type="button" title="关闭（Esc）" aria-label="关闭搜索">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>

  <!-- 设置面板 -->
  <div class="popover glass" id="popover" hidden role="dialog" aria-label="阅读设置">
    <div class="pop-section">
      <h3>主题</h3>
      <div class="pop-row">
        <span class="label">外观</span>
        <div class="segmented" role="group" aria-label="外观模式">
          <button type="button" data-theme-opt="system" aria-label="跟随系统">自</button>
          <button type="button" data-theme-opt="light" aria-label="浅色">浅</button>
          <button type="button" data-theme-opt="dark" aria-label="深色">深</button>
        </div>
      </div>
      <div class="pop-row">
        <span class="label">正文用衬线字体</span>
        <button class="switch" id="sw-serif" type="button" role="switch" aria-pressed="false" aria-label="正文用衬线字体"></button>
      </div>
    </div>

    <div class="pop-section">
      <h3>阅读</h3>
      <div class="pop-row stack">
        <span class="label">字号 <span class="value" id="v-scale" style="float:right"></span></span>
        <input class="range" id="r-scale" type="range" min="0.85" max="1.4" step="0.01" aria-label="字号">
      </div>
      <div class="pop-row stack">
        <span class="label">行距 <span class="value" id="v-leading" style="float:right"></span></span>
        <input class="range" id="r-leading" type="range" min="0.9" max="1.5" step="0.01" aria-label="行距">
      </div>
      <div class="pop-row stack">
        <span class="label">栏宽 <span class="value" id="v-width" style="float:right"></span></span>
        <input class="range" id="r-width" type="range" min="560" max="1000" step="10" aria-label="栏宽">
      </div>
      <div class="pop-row">
        <span class="label">代码块自动换行</span>
        <button class="switch" id="sw-wrap" type="button" role="switch" aria-pressed="true" aria-label="代码块自动换行"></button>
      </div>
      <div class="pop-row">
        <span class="label">显示侧栏</span>
        <button class="switch" id="sw-sidebar" type="button" role="switch" aria-pressed="true" aria-label="显示侧栏"></button>
      </div>
    </div>

    <div class="pop-section">
      <h3>背景</h3>
      <div class="swatches" id="swatches"></div>
      <div class="pop-row stack" style="margin-top:12px">
        <span class="label">模糊 <span class="value" id="v-blur" style="float:right"></span></span>
        <input class="range" id="r-blur" type="range" min="0" max="48" step="1" aria-label="背景模糊">
      </div>
      <div class="pop-row stack">
        <span class="label">压暗 / 提亮 <span class="value" id="v-dim" style="float:right"></span></span>
        <input class="range" id="r-dim" type="range" min="0" max="0.7" step="0.01" aria-label="背景遮罩强度">
      </div>
      <div class="pop-row stack">
        <span class="label">玻璃面板不透明度 <span class="value" id="v-glass" style="float:right"></span></span>
        <input class="range" id="r-glass" type="range" min="0.2" max="0.95" step="0.01" aria-label="玻璃面板不透明度">
      </div>
      <div class="pop-row">
        <span class="label">恢复默认设置</span>
        <button class="btn" id="btn-reset" type="button">重置</button>
      </div>
    </div>
  </div>

  <!-- 图片灯箱 / 轻提示 / 移动端遮罩 / 拖放提示 -->
  <div class="lightbox" id="lightbox" hidden><img id="lightbox-img" alt=""></div>
  <div class="toast glass" id="toast" role="status" aria-live="polite"></div>
  <div class="scrim" id="scrim"></div>
  <div class="drop-hint" id="drop-hint">松手即可打开这个 Markdown 文件</div>

  <input type="file" id="file-input" accept=".md,.markdown,.mdown,.mkd,.txt,text/markdown" hidden>

  <!-- 依赖全部是本地文件：断网可用、也不经过任何 CDN -->
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/katex.min.js"></script>
  <script src="sample.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
