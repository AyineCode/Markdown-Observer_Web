<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>measure —— 用真实浏览器量算按钮样式</title>
<style>
  body { font: 12px/1.45 Consolas, monospace; margin: 10px; }
  #out { white-space: pre-wrap; }
  iframe { width: 1400px; height: 880px; border: 1px solid #ccc; margin-top: 10px; }
</style>
</head>
<body>
<pre id="out">measuring…</pre>
<iframe id="frame" src="/"></iframe>
<script>
/*
  把 index.html 装进同源 iframe，用 getComputedStyle 量出"真实浏览器算完之后"的颜色。
  两个要点（踩过坑）：
    1. 先注入 * { transition: none } —— 否则主题切换的过渡动画会让你量到中间值，
       看起来像"同一个变量在不同元素上解析成了不同颜色"；
    2. 主题要显式点按钮强制，别依赖系统（本机系统是深色）。
  跑法：chrome --headless=new --dump-dom --virtual-time-budget=12000 http://127.0.0.1:4321/tools/measure.html
*/
const out = [];
const log = (line) => out.push(line);
const frame = document.getElementById('frame');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

const TARGETS = [
  ['侧栏 打开文件(.btn.block)', '#btn-open-file'],
  ['顶栏 图标按钮(.icon-btn)', '.topbar .icon-btn'],
  ['分段 未选中', '.segmented button:not([aria-pressed="true"])'],
  ['分段 选中', '.segmented button[aria-pressed="true"]'],
  ['空状态 卡片', '#card-open'],
  ['空状态 按钮', '#btn-sample'],
  ['色板 无背景', '.swatch.plain'],
  ['左下角 设置座位', '.settings-seat'],
  ['参照 侧栏面板', '.sidebar'],
  ['参照 顶栏面板', '.topbar'],
];

function measure(doc, tag) {
  log('===== ' + tag + ' =====');
  log('body 有 data-ds-dark-theme: ' + (doc.body.hasAttribute('data-ds-dark-theme') ? 'yes' : 'no'));
  for (const [label, selector] of TARGETS) {
    const el = doc.querySelector(selector);
    if (el === null) { log(label + ': 找不到 ' + selector); continue; }
    const cs = doc.defaultView.getComputedStyle(el);
    log(label.padEnd(26) + ' bg=' + cs.getPropertyValue('background-color').padEnd(24)
      + ' 边=' + (cs.getPropertyValue('border-top-width') + ' ' + cs.getPropertyValue('border-top-style') + ' ' + cs.getPropertyValue('border-top-color')).padEnd(34)
      + ' 磨砂=' + cs.getPropertyValue('backdrop-filter').slice(0, 26));
  }
  const root = doc.defaultView.getComputedStyle(doc.documentElement);
  const body = doc.defaultView.getComputedStyle(doc.body);
  log('变量  html: veil=' + root.getPropertyValue('--btn-glass-veil').trim() + ' alpha=' + root.getPropertyValue('--btn-glass-alpha').trim()
    + ' | body: veil=' + body.getPropertyValue('--btn-glass-veil').trim() + ' alpha=' + body.getPropertyValue('--btn-glass-alpha').trim()
    + ' alpha-on=' + body.getPropertyValue('--btn-glass-alpha-on').trim());
}

frame.addEventListener('load', async () => {
  const doc = frame.contentDocument;
  const win = frame.contentWindow;
  await wait(600);
  const style = doc.createElement('style');
  style.textContent = '*, *::before, *::after { transition: none !important; animation: none !important; }';
  doc.head.appendChild(style);
  out.length = 0;
  log('系统 prefers-color-scheme: dark = ' + win.matchMedia('(prefers-color-scheme: dark)').matches);
  doc.querySelector('[data-theme="light"]').click();
  await wait(500);
  measure(doc, '强制浅色');
  doc.querySelector('[data-theme="dark"]').click();
  await wait(500);
  measure(doc, '强制深色');

  // 空状态卡片：文字要在「自己那块空间」里居中（左边还有图标）；那行小灰字在卡片下方
  const card = doc.getElementById('card-open');
  if (card !== null && card.hidden === false) {
    const textBlock = card.querySelector('.card-text');
    const titleSpan = card.querySelector('.card-title');
    const range = doc.createRange();
    range.selectNodeContents(titleSpan);
    const glyph = range.getBoundingClientRect();
    const block = textBlock.getBoundingClientRect();
    const offset = Math.abs((glyph.left + glyph.right) / 2 - (block.left + block.right) / 2);
    const note = doc.querySelector('.empty-note');
    const cardRect = card.getBoundingClientRect();
    const noteRect = note === null ? null : note.getBoundingClientRect();
    const sub = doc.querySelector('.empty-sub');
    log('空状态卡片  标题文字居中偏移=' + offset.toFixed(1) + 'px（0 表示正居中）'
      + '  卡片高=' + Math.round(cardRect.height)
      + '  说明行=' + (note === null ? '找不到' : ('字号 ' + win.getComputedStyle(note).fontSize + '，在卡片下方 ' + (noteRect.top >= cardRect.bottom ? 'yes' : 'no')))
      + '  正文说明=' + (sub === null ? '找不到' : (win.getComputedStyle(sub).fontSize + '/' + win.getComputedStyle(sub).lineHeight + ' 对齐 ' + win.getComputedStyle(sub).textAlign)));
  }

  // 设置弹层：入口在左下角，所以它必须翻到按钮上方并完整落在视口里
  doc.getElementById('btn-settings').click();
  await wait(300);
  const pop = doc.getElementById('popover');
  const seat = doc.getElementById('btn-settings').getBoundingClientRect();
  const box = pop.getBoundingClientRect();
  const inside = box.top >= 0 && box.left >= 0 && box.bottom <= win.innerHeight && box.right <= win.innerWidth;
  const above = box.bottom <= seat.top + 1;
  log('设置弹层  left=' + Math.round(box.left) + '（座位 left=' + Math.round(seat.left) + '）  bottom=' + Math.round(box.bottom) + '（座位 top=' + Math.round(seat.top) + '）  视口=' + win.innerWidth + 'x' + win.innerHeight);
  log('设置弹层  完整在视口内=' + (inside ? 'yes' : 'no') + '  开在座位上方=' + (above ? 'yes' : 'no'));

  // 设置面板：固定高度 + 内部纵向滚动——切页签高度不该变，也不该越出视口
  const panelH = () => Math.round(doc.getElementById('popover').getBoundingClientRect().height);
  const typeH = panelH();
  doc.querySelector('[data-ptab="bg"]').click();
  await wait(220);
  const bgH = panelH();
  const activePane = doc.querySelector('.pop-pane:not([hidden])');
  const paneStyle = win.getComputedStyle(activePane);
  const panelRect = doc.getElementById('popover').getBoundingClientRect();
  log('设置面板  排版高=' + typeH + '  背景高=' + bgH + '  高度固定=' + (Math.abs(typeH - bgH) <= 1 ? 'yes' : 'no（错了）')
    + '  越界=' + (panelRect.top < 0 || panelRect.bottom > win.innerHeight ? 'yes（错了）' : 'no')
    + '  横向=' + activePane.scrollWidth + '/' + activePane.clientWidth + (activePane.scrollWidth > activePane.clientWidth ? '（溢出，错了）' : '（不溢出）')
    + '  纵向内容=' + activePane.scrollHeight + '/' + activePane.clientHeight + '  可滚动=' + paneStyle.overflowY);
  // 底部渐隐：背景页能滚时应出现（data-more=true），滚到底时应收起
  const scrollPane = doc.querySelector('.pop-pane:not([hidden])');
  const fadeOn = pop.dataset.more === 'true' && win.getComputedStyle(pop, '::after').opacity !== '0';
  scrollPane.scrollTop = scrollPane.scrollHeight;
  scrollPane.dispatchEvent(new win.Event('scroll'));
  await wait(200);
  const fadeOffAtBottom = pop.dataset.more === 'false';
  log('底部渐隐  能滚时出现=' + (fadeOn ? 'yes' : 'no（错了）') + '  滚到底收起=' + (fadeOffAtBottom ? 'yes' : 'no（错了）'));
  scrollPane.scrollTop = 0;
  scrollPane.dispatchEvent(new win.Event('scroll'));
  doc.querySelector('[data-ptab="type"]').click();
  await wait(180);

  // "最近使用"那一行：换一次背景后，5 个格子必须在同一行、等宽、边距一致
  const swatches = doc.querySelectorAll('#swatches .swatch');
  if (swatches.length > 1) swatches[1].click();
  await wait(250);
  const recents = [...doc.querySelectorAll('#recents .recent')];
  const tops = new Set(recents.map((el) => Math.round(el.getBoundingClientRect().top)));
  const heights = new Set(recents.map((el) => Math.round(el.getBoundingClientRect().height)));
  const margins = new Set(recents.map((el) => win.getComputedStyle(el).marginTop));
  const slots = recents.filter((el) => el.classList.contains('slot'));
  log('最近使用  ' + recents.length + ' 个格子  行数=' + tops.size + '  高度种类=' + heights.size + '  上边距=' + [...margins].join('/'));
  log('最近使用  空格子类名=slot ' + (slots.length > 0 ? 'yes' : '（当前没有空格子）') + '  空格子误匹配 .empty=' + (slots.some((el) => el.matches('.empty')) ? 'yes（错了）' : 'no'));

  // 设一张图片当背景：背景和缩略图都必须"立刻"出现，不能等 IndexedDB，也不能等下一次重画
  const canvas = doc.createElement('canvas');
  canvas.width = 64; canvas.height = 40;
  canvas.getContext('2d').fillRect(0, 0, 64, 40);
  const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
  const data = new win.DataTransfer();
  data.items.add(new win.File([blob], 'probe.png', { type: 'image/png' }));
  const fileInput = doc.getElementById('file-input');
  fileInput.files = data.files;
  fileInput.dispatchEvent(new win.Event('change', { bubbles: true }));
  await wait(150);
  const firstCell = doc.querySelector('#recents .recent');
  const firstStyle = firstCell === null ? null : win.getComputedStyle(firstCell);
  log('设图片背景  立刻 bgMode=' + doc.body.dataset.bgMode
    + '  缩略图=' + ((firstStyle !== null && firstStyle.backgroundImage.startsWith('url(')) ? 'yes' : 'no（错了）')
    + '  pending=' + (firstCell !== null && firstCell.classList.contains('pending'))
    + '  --bg-image 长度=' + (doc.documentElement.style.getPropertyValue('--bg-image') || '').length);
  log('===== 结束 =====');
  document.getElementById('out').textContent = out.join('\n');
});
</script>
</body>
</html>
